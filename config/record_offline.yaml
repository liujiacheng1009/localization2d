# Offline mapping for real-robot datasets/record/{01..04} (LD14).
# skip_insert_* is LD14-only: in-place turns destort poorly, so those frames
# match but do not write occupancy. Simulation configs must omit both keys.
map_builder:
  use_trajectory_builder_2d: true
  collate_by_trajectory: false
  pose_graph:
    # Smaller => loop corrections apply sooner; watch CPU if backend falls behind.
    optimize_every_n_nodes: 10
    # SPA backend: ceres | gtsam (batch LM) | gtsam_isam2 (incremental, default).
    optimizer: gtsam_isam2
    constraint_builder:
      sampling_ratio: 0.15
      max_constraint_distance: 12.0
      min_score: 0.65
      global_localization_min_score: 0.7
      loop_closure_translation_weight: 11000.0
      loop_closure_rotation_weight: 100000.0
      log_matches: true
      fast_correlative_scan_matcher:
        linear_search_window: 7.0
        angular_search_window: 0.5235987755982988
        branch_and_bound_depth: 7
      ceres_scan_matcher:
        occupied_space_weight: 20.0
        translation_weight: 10.0
        rotation_weight: 1.0
        ceres_solver_options:
          use_nonmonotonic_steps: true
          max_num_iterations: 10
          num_threads: 1
    matcher_translation_weight: 500.0
    matcher_rotation_weight: 1600.0
    optimization_problem:
      huber_scale: 10.0
      local_slam_pose_translation_weight: 100000.0
      local_slam_pose_rotation_weight: 100000.0
      odometry_translation_weight: 100.0
      odometry_rotation_weight: 10.0
      log_solver_summary: false
      ceres_solver_options:
        use_nonmonotonic_steps: false
        max_num_iterations: 50
        num_threads: 4
      gtsam:
        max_iterations: 50
        relinearize_threshold: 0.1
        relinearize_skip: 10
    max_num_final_iterations: 100
    global_sampling_ratio: 0.003
    log_residual_histograms: true
trajectory_builder:
  trajectory_builder_2d:
    min_range: 0.05
    max_range: 12.0
    min_z: -0.2
    max_z: 0.5
    missing_data_ray_length: 12.0
    num_accumulated_range_data: 1
    voxel_filter_size: 0.025
    adaptive_voxel_filter:
      max_length: 0.3
      min_num_points: 120
      max_range: 12.0
    loop_closure_adaptive_voxel_filter:
      max_length: 0.5
      min_num_points: 80
      max_range: 12.0
    use_online_correlative_scan_matching: true
    real_time_correlative_scan_matcher:
      linear_search_window: 0.15
      angular_search_window: 0.5235987755982988
      translation_delta_cost_weight: 0.1
      rotation_delta_cost_weight: 0.1
    ceres_scan_matcher:
      occupied_space_weight: 10.0
      translation_weight: 10.0
      rotation_weight: 40.0
      ceres_solver_options:
        use_nonmonotonic_steps: false
        max_num_iterations: 20
        num_threads: 1
    motion_filter:
      max_time_seconds: 1.0
      max_distance_meters: 0.05
      max_angle_radians: 0.035
    # LD14-only. Omit on Gazebo / exploration; default 0 means always insert.
    skip_insert_after_gap_seconds: 0.25
    skip_insert_while_turning_radians: 0.06
    # Intra-scan yaw from first to last beam. Match but do not paint when the
    # sweep still destorts after deskew (avoids multilayer walls on turns).
    skip_insert_destort_yaw_radians: 0.08
    # Peak |yaw| inside any 80 ms of the sweep. Partial bend often has a short
    # fast turn while first→last destort_yaw stays small (~0.03).
    skip_insert_peak_segment_seconds: 0.08
    skip_insert_peak_segment_yaw_radians: 0.05
    # Post-turn residual bend only: arm when any yaw signal > 0.06 (same as
    # turning gate), keep armed 1 s, narrow correlative (~1/15 of online cost).
    skip_insert_half_scan_arm_yaw_radians: 0.06
    skip_insert_half_scan_after_turn_seconds: 1.0
    skip_insert_half_scan_linear_search_window: 0.09
    skip_insert_half_scan_angular_search_window: 0.05
    skip_insert_half_scan_yaw_radians: 0.03
    skip_insert_half_scan_translation_meters: 0.06
    # Insert-only horizon (matching still uses max_range 12 m). Cuts LD14
    # flying returns that paint speckles past room walls into unknown space.
    skip_insert_max_range_meters: 5.0
    # Insert-only: drop far returns that conflict with the active submap
    # (threshold = base + per_meter * R). Matching still uses the full cloud.
    # LD14 deskew leaves non-rigid bend even when match looks OK; cover near
    # walls too (red-box multilayer is often 0.8–2 m, not only far beams).
    skip_insert_far_disagree_min_range_meters: 0.8
    skip_insert_far_disagree_base_meters: 0.04
    skip_insert_far_disagree_per_meter: 0.01
    # Bent sweeps: if this many band hits are ghost rejects, skip whole insert
    # so remaining hits cannot thicken a parallel wall.
    skip_insert_far_disagree_ratio: 0.15
    # Match-quality LOST → Frontend Relocalize (global search). Catches wrong
    # local minima where the pose drifts far from the map.
    tracking_min_match_agree_ratio: 0.35
    tracking_min_correlative_score: 0
    tracking_bad_match_frames: 3
    pose_extrapolator:
      constant_velocity:
        pose_queue_duration: 0.001
    submaps:
      num_range_data: 35
      grid_options_2d:
        grid_type: PROBABILITY_GRID
        resolution: 0.03
      range_data_inserter:
        range_data_inserter_type: PROBABILITY_GRID_INSERTER_2D
        probability_grid_range_data_inserter:
          insert_free_space: true
          hit_probability: 0.55
          miss_probability: 0.49
tracking_frame: base_link
